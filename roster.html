<!DOCTYPE html>

        text-align: center;
    }

    /* LOGO — SAME AS HOME PAGE */
    .logo-container {
        margin-top: 40px;

    .rank-block {

        max-width: 700px;

        border: 2px solid #b300ff;
        border-radius: 12px;
        background: rgba(20, 0, 30, 0.6);

    .rank-title {

        margin-bottom: 15px;

    }

    .name {
        font-size: 1.4rem;
        color: #b300ff;
        margin: 8px 0;
        font-weight: 600;
        text-shadow: 0 0 10px #8000ff;

</style>
